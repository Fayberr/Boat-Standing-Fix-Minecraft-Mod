# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Target: Minecraft 26.1.x (26.1, 26.1.1, 26.1.2) - build against the lowest for a single jar.
minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.145.1+26.1
# Note: requires Gradle 9.7.0+ (Loom 1.17.x declares plugin API 9.5.0).

# Mod Properties
version=1.0.2
group=net.fayber
archives_base_name=boat-standing-fix
mod_id=boat_standing_fix

# This machine has no system-wide JDK 25, so pin Gradle to the local Temurin install.
org.gradle.java.home=/home/fayber/.jdks/jdk-25.0.4+7
